<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tailwind Project</title>
    <link rel="stylesheet" href="./output.css">
</head>


<body class="bg-slate-950 text-white min-h-screen">



    <header class="sticky top-0 z-50 border-b border-white/10 bg-slate-950/80 backdrop-blur-xl">

        <nav class="max-w-6xl mx-auto px-5 sm:px-6 py-4 flex items-center justify-between gap-4">

            <!-- Brand Logo -->
            <a href="#hero" class="group flex items-center gap-2 shrink-0">

                <span
                    class="flex h-9 w-9 items-center justify-center rounded-xl bg-blue-600 text-white font-bold shadow-lg shadow-blue-600/20 transition duration-300 group-hover:rotate-12 group-hover:scale-110">
                    D
                </span>

                <span class="text-lg sm:text-xl font-bold tracking-tight text-white">
                    Digital<span class="text-blue-400">Future</span>
                </span>

            </a>

            <!-- Navigation Links -->
            <div class="hidden md:flex items-center gap-8">

                <a href="#hero"
                    class="group relative text-sm font-medium text-slate-300 hover:text-white transition-colors duration-300">
                    Home
                    <span
                        class="absolute -bottom-2 left-0 h-0.5 w-0 bg-blue-400 transition-all duration-300 group-hover:w-full"></span>
                </a>

                <a href="#features"
                    class="group relative text-sm font-medium text-slate-300 hover:text-white transition-colors duration-300">
                    Features
                    <span
                        class="absolute -bottom-2 left-0 h-0.5 w-0 bg-blue-400 transition-all duration-300 group-hover:w-full"></span>
                </a>

                <a href="#contact"
                    class="group relative text-sm font-medium text-slate-300 hover:text-white transition-colors duration-300">
                    Contact
                    <span
                        class="absolute -bottom-2 left-0 h-0.5 w-0 bg-blue-400 transition-all duration-300 group-hover:w-full"></span>
                </a>

            </div>

            <!-- CTA Button -->
            <a href="#contact"
                class="hidden md:inline-flex items-center rounded-full bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white shadow-lg shadow-blue-600/20 transition-all duration-300 hover:-translate-y-1 hover:bg-blue-500 hover:shadow-blue-500/40">
                Let's Talk
                <span class="ml-2">↗</span>
            </a>

            <!-- Mobile Dropdown -->
            <details class="group relative md:hidden">

                <summary
                    class="flex cursor-pointer list-none items-center justify-center rounded-lg border border-white/15 px-3 py-2 text-sm font-medium text-white hover:bg-white/10">
                    Menu
                </summary>

                <div
                    class="absolute right-0 top-full mt-3 flex w-48 flex-col gap-1 rounded-xl border border-white/10 bg-slate-900 p-2 shadow-2xl">

                    <a href="#hero"
                        class="rounded-lg px-4 py-3 text-slate-200 hover:bg-blue-600 hover:text-white transition">
                        Home
                    </a>

                    <a href="#features"
                        class="rounded-lg px-4 py-3 text-slate-200 hover:bg-blue-600 hover:text-white transition">
                        Features
                    </a>

                    <a href="#contact"
                        class="rounded-lg px-4 py-3 text-slate-200 hover:bg-blue-600 hover:text-white transition">
                        Contact
                    </a>

                </div>

            </details>

        </nav>
    </header>



    <main> <!-- HERO SECTION -->




        

<section id="hero"
    class="grid grid-cols-1 md:grid-cols-2 items-center gap-10 max-w-6xl mx-auto px-6 pt-8 pb-16 md:pt-10 md:pb-12 lg:pt-16 lg:pb-16 lg:min-h-[calc(100vh-64px)] scroll-mt-20">





            <!-- LEFT COLUMN -->
            <div class="text-center md:text-left">

                <h1 class="text-4xl md:text-5xl font-bold text-white mb-4">
                    Build Your Digital Future
                </h1>

                <p class="text-slate-300 mb-6">
                    We create simple and modern digital experiences for everyone.
                </p>

                <a href="#contact"
                    class="inline-block bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition">
                    Get Started
                </a>

            </div>

            <!-- RIGHT COLUMN -->
            <div>
                <img src="images/hero.jpg" alt="Digital future illustration" class="w-full h-auto rounded-xl shadow-lg">
            </div>

        </section>


    </main>

</body>


</html>
